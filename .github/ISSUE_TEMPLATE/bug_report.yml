name: Bug report
description: A skill did something wrong, skipped a step or broke.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove private code and secrets from anything you paste.
        Security problems (prompt injection, unasked pushes, data leaks) go to SECURITY.md instead.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill, e.g. `/mix-plan`, `mix-review`.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the skill did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and the relevant repo setup (single repo, multi-repo, hub, no git).
      placeholder: |
        1. /mix-setup in a repo with ...
        2. /mix-specify "..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: Transcript or files
      description: The relevant part of the session, `state.yml`, `mix.yml` or generated files.
      render: text
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x, Cursor, Codex CLI...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed
      options:
        - Claude Code plugin
        - install.sh
        - skills.sh (npx skills)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mix-dev-skills version
      description: The `version` in `.claude-plugin/plugin.json`, or the commit.
